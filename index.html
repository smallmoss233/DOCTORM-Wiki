<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOD WIKI | DOCTOR M</title>
    <link rel="stylesheet" href="wiki.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@11/marked.min.js"></script>
    <link rel="icon" type="image/png" href="assets/wiki-icon.png">
</head>
<body>

<!-- ★ 自发光背景图 -->
<div class="wiki-bg">
    <img src="assets/wiki-dg.png" alt="" aria-hidden="true">
</div>

<div class="wiki-app">

    <!-- ★ 移动端顶部栏（桌面隐藏） -->
    <div class="wiki-mobile-header">
        <div class="wiki-mobile-brand">
            <div class="wiki-mobile-brand-icon">D</div>
            <span>DOCTOR M WIKI</span>
        </div>
        <button class="wiki-mobile-toggle" aria-label="打开菜单" data-i18n-aria="menuOpen">☰</button>
    </div>

    <!-- 左侧 -->
    <aside class="wiki-sidebar" id="wiki-sidebar">
        <div class="wiki-brand">
            <!-- ★ 换成本地图标 -->
            <img class="wiki-brand-icon" src="assets/wiki-icon.png" alt="DOCTOR M">
            <div class="wiki-brand-text">
                <div class="wiki-brand-title">DOCTOR M - WIKI</div>
                <div class="wiki-brand-sub" data-i18n="siteTagline">一款AIT扩展模组！</div>
            </div>
            <!-- ★ 移动端关闭按钮（桌面隐藏） -->
            <button class="wiki-sidebar-close" aria-label="关闭菜单" data-i18n-aria="menuClose">×</button>
        </div>

        <!-- ★★★ 语言切换器 ★★★ -->
        <div class="wiki-lang-switch" id="wiki-lang-switch"></div>

        <nav class="wiki-nav" id="wiki-nav"></nav>

        <div class="wiki-footer">
            <a href="index.html" data-i18n="backToSite">← 返回主站</a>
        </div>
    </aside>

    <!-- ★ 遮罩层（桌面隐藏） -->
    <div class="wiki-mobile-mask" id="wiki-mobile-mask"></div>

    <main class="wiki-main">
        <article class="wiki-content" id="wiki-content">
            <div class="wiki-loading">加载中…</div>
        </article>

        <!-- ★ 右侧目录 -->
        <aside class="wiki-toc" id="wiki-toc">
            <div class="wiki-toc-title" data-i18n="tocTitle">本页目录</div>
            <nav class="wiki-toc-nav" id="wiki-toc-nav"></nav>
        </aside>
    </main>

</div>

<script src="wiki.js"></script>
</body>
</html>
